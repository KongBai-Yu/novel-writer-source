name: novel_writer
description: "A cross-platform novel writing tool with AI assistance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  
  # HTTP Client
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  
  # Utilities
  uuid: ^4.4.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  collection: ^1.18.0
  
  # Rich Text Editor
  flutter_quill: ^11.5.0
  
  # Drag & Drop / Reorder
  reorderables: ^0.6.0
  
  # Graph Visualization
  graphview: ^1.2.0
  
  # Charts
  fl_chart: ^0.68.0
  
  # File Picker
  file_picker: ^8.0.5
  
  # EPUB Generation
  archive: ^3.6.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

